### Splunk App Deployment Playbook ###
#
# Pull a Git repo that will be used to distribute apps
#
- hosts: localhost
  tags: [ repo_pull ]
  remote_user: "{{ localhost_user }}"
  vars_files:
  - header.yml
  tasks:
  - name: pull git repo
    git:
      repo: "{{ git_repo_location }}"
      dest: "{{ git_repo_destination }}"
      version: "{{ git_version }}"
      update: yes
      accept_hostkey: yes
    when: use_repo

#
# A Play to deploy apps to shcluster/apps and apply shcluster-bundle
#
- hosts: deployer
  tags: [ deployer ]
  remote_user: "{{ remote_ansible_user }}"
  become: "{{ remote_become }}"
  become_user: "{{ remote_become_user }}"
  vars_files:
  - header.yml
  - manifest.yml
  vars:
    app_tags: ['deployer', 'all']
    apps_dir: "{{ splunk_home }}/etc/shcluster/apps"
    clear_tasks: clear_apps.yml
    apply_tasks: deployer_apply.yml
  tasks:
  - include_tasks: "tasks/deploy.yml"
#
# A play to deploy apps to master-apps and apply the bundle
#
- hosts: cluster_master
  tags: [ master ]
  remote_user: "{{ remote_ansible_user }}"
  become: "{{ remote_become }}"
  become_user: "{{ remote_become_user }}"
  vars_files:
  - header.yml
  - manifest.yml
  vars:
    app_tags: ['master', 'all']
    apps_dir: "{{ splunk_home }}/etc/master-apps"
    clear_tasks: clear_master.yml
    apply_tasks: master_apply.yml
  tasks:
  - include_tasks: "tasks/deploy.yml"

#
# A play to deploy apps to deployment-apps and reload the deployment server
#
- hosts: deployment_server
  tags: [ deployment ]
  remote_user: "{{ remote_ansible_user }}"
  become: "{{ remote_become }}"
  become_user: "{{ remote_become_user }}"
  vars_files:
  - header.yml
  - manifest.yml
  vars:
    app_tags: ['deployment', 'all']
    apps_dir: "{{ splunk_home }}/etc/deployment-apps"
    clear_tasks: clear_apps.yml
    apply_tasks: deployment_reload.yml
  tasks:
  - include_tasks: "tasks/deploy.yml"

#
# A play to deploy apps into etc/apps and restart a Splunk intance
#
- hosts: etc_apps
  tags: [ etc ]
  remote_user: "{{ remote_ansible_user }}"
  become: "{{ remote_become }}"
  become_user: "{{ remote_become_user }}"
  vars_files:
  - header.yml
  - manifest.yml
  vars:
    app_tags: ['etc_apps', 'all']
    apps_dir: "{{ splunk_home }}/etc/apps"
    clear_tasks: clear_etc_apps.yml
    apply_tasks: etc_restart.yml
  tasks:
  - include_tasks: "tasks/deploy.yml"
