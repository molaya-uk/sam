- name: ensure tmp dir is present
  file:
    path: "{{ ansible_tmp }}"
    state: directory

- name: backup files
  shell: "if [ -d {{ apps_dir }}/{{ item }} ]; then cp -r {{ apps_dir }}/{{ item }} {{ ansible_tmp }}/; fi"
  with_items:
  - "{{ splunk_default_apps }}"

- name: empty apps directory
  shell: "/bin/rm -rf {{ apps_dir }}/*"

- name: restore default apps
  shell: "mv {{ ansible_tmp }}/* {{ apps_dir }}/"